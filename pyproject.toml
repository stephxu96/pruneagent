[project]
name = "pruneagent"
version = "0.1.0"
description = "LLM agent that prunes Qwen3 to Wanda-level quality with real memory and speed savings"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Steph Xu" }]
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",       # first release with Qwen3
    "datasets>=3.0",
    "safetensors>=0.4",
    "langgraph>=1.2,<2",
    "lm-eval>=0.4.8",
    "typer>=0.12",
    "accelerate>=1.16.0",
    "pydantic>=2.7",           # state types and the agent reply schema (task 2.1)
]

[project.scripts]
pruneagent = "pruneagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pruneagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["build", "build_ps06.py"]
